<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger Duo — Habit Tracker</title>
<meta name="theme-color" content="#1B1E17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger Duo">
<link rel="manifest" id="manifestLink">
<link rel="icon" id="faviconLink">
<link rel="apple-touch-icon" id="appleIconLink">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#1B1E17;
  --ink-2:#242820;
  --paper-dim:#E4DFCB;
  --gold:#C89B3C;
  --gold-light:#DDBB66;
  --berry:#A8456B;
  --berry-light:#CE6E8F;
  --text-light:#F3EFE1;
  --text-dim:#B9B4A0;
  --line: rgba(243,239,225,0.12);
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--ink);color:var(--text-light);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
.app{max-width:820px;margin:0 auto;padding:28px 18px 80px;}

.masthead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:16px;}
.masthead h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;margin:0;letter-spacing:-0.01em;}
.masthead .sub{color:var(--text-dim);font-size:13px;font-family:'JetBrains Mono',monospace;margin-top:4px;}
.masthead .date{text-align:right;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold-light);}

.tabs{display:flex;gap:4px;margin-bottom:22px;background:var(--ink-2);border-radius:var(--radius);padding:4px;}
.tab-btn{flex:1;padding:10px 12px;background:transparent;border:none;color:var(--text-dim);font-weight:500;font-size:14px;border-radius:7px;cursor:pointer;}
.tab-btn:hover{color:var(--text-light);}
.tab-btn.active{background:#3a3f33;color:var(--text-light);}
.tab-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

.view{display:none;}
.view.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* Head-to-head scoreboard */
.scoreboard{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
.score-side{text-align:center;flex:1;}
.score-name{font-family:'Fraunces',serif;font-size:15px;font-weight:600;cursor:pointer;}
.score-pts{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;margin-top:2px;}
.score-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}
.score-vs{font-family:'Fraunces',serif;font-size:13px;color:var(--text-dim);font-style:italic;}
.crown{font-size:13px;}

/* Columns */
.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:560px){.columns{grid-template-columns:1fr;}}
.person-card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;border-top:3px solid var(--p-color);}
.person-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.person-name{font-family:'Fraunces',serif;font-size:18px;font-weight:600;cursor:pointer;color:var(--p-color);}
.person-name:hover{text-decoration:underline;}
.person-pct{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);}
.progress-track{height:7px;background:var(--paper-dim);border-radius:4px;overflow:hidden;margin-bottom:12px;opacity:.9;}
.progress-fill{height:100%;background:var(--p-color);border-radius:4px;transition:width .3s ease;}

.habit-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);}
.habit-row:last-child{border-bottom:none;}
.check{width:23px;height:23px;border-radius:50%;border:2px solid var(--p-color);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.check.checked{background:var(--p-color);}
.check svg{opacity:0;width:12px;height:12px;}
.check.checked svg{opacity:1;}
.habit-name{flex:1;font-size:14px;}
.habit-name.done{color:var(--text-dim);text-decoration:line-through;}
.streak{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold-light);white-space:nowrap;}
.del-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:2px;opacity:.5;}
.del-btn:hover{opacity:1;color:var(--berry-light);}
.empty{color:var(--text-dim);font-size:13px;text-align:center;padding:16px 6px;font-style:italic;}

.add-form{display:flex;gap:6px;margin-top:10px;}
.add-form input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--text-light);font-size:13px;font-family:'Inter',sans-serif;}
.add-form input:focus{outline:2px solid var(--p-color);outline-offset:1px;}
.btn{background:var(--p-color);color:var(--ink);border:none;border-radius:7px;padding:8px 13px;font-weight:600;font-size:13px;cursor:pointer;}
.btn:hover{filter:brightness(1.12);}

/* Calendar */
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cal-nav .month-label{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
.cal-nav button{background:var(--ink-2);border:1px solid var(--line);color:var(--text-light);width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:15px;}
.cal-nav button:hover{background:#3a3f33;}
.legend{display:flex;gap:16px;margin-bottom:12px;font-size:12px;color:var(--text-dim);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
.weekday-row div{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day-cell{position:relative;aspect-ratio:1;border-radius:7px;background:var(--ink);border:1px solid var(--line);overflow:hidden;cursor:pointer;display:flex;}
.day-cell:hover{border-color:var(--gold);}
.day-cell.empty-cell{visibility:hidden;pointer-events:none;}
.day-cell.today{border-color:var(--gold-light);border-width:2px;}
.day-cell.future{opacity:.3;cursor:default;}
.half{position:relative;flex:1;height:100%;overflow:hidden;}
.half-fill{position:absolute;bottom:0;left:0;right:0;}
.day-num{position:absolute;top:3px;left:0;right:0;text-align:center;z-index:2;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-light);text-shadow:0 1px 2px rgba(0,0,0,.6);}

.day-panel{margin-top:16px;}
.day-panel-title{font-family:'Fraunces',serif;font-size:17px;margin-bottom:10px;}
.day-panel-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:560px){.day-panel-cols{grid-template-columns:1fr;}}
.day-panel-name{font-size:13px;font-weight:600;margin-bottom:6px;}

/* Goals */
.goal-card{background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:13px;margin-bottom:10px;}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.goal-name{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}
.goal-row{display:flex;align-items:center;gap:8px;margin-top:9px;}
.goal-track{flex:1;height:7px;background:var(--paper-dim);border-radius:4px;overflow:hidden;}
.goal-fill{height:100%;background:var(--p-color);border-radius:4px;}
.goal-nums{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold-light);white-space:nowrap;}
.goal-controls{display:flex;gap:6px;margin-top:8px;}
.goal-controls button{background:var(--ink-2);border:1px solid var(--line);color:var(--text-light);width:24px;height:24px;border-radius:6px;cursor:pointer;}
.goal-controls button:hover{background:#3a3f33;}

.extra-fields{display:none;gap:6px;margin-top:6px;flex-wrap:wrap;}
.extra-fields.show{display:flex;}
.extra-fields input{background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 9px;color:var(--text-light);font-size:12px;font-family:'Inter',sans-serif;}
.extra-fields input[type=number]{width:80px;}
.extra-fields input[type=text]{flex:1;min-width:100px;}
.toggle-more{background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;text-decoration:underline;padding:2px 0;margin-top:4px;}

.note{font-size:12px;color:var(--text-dim);text-align:center;margin-top:18px;line-height:1.5;}

/* Install banner */
.install-banner{position:fixed;left:14px;right:14px;bottom:14px;max-width:730px;margin:0 auto;background:var(--ink-2);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.install-banner .icn{width:34px;height:34px;border-radius:8px;flex-shrink:0;}
.install-banner .txt{flex:1;font-size:12.5px;line-height:1.4;color:var(--text-light);}
.install-banner .txt b{color:var(--gold-light);}
.install-banner .actions{display:flex;gap:8px;flex-shrink:0;}
.install-banner button{border:none;border-radius:7px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.install-banner .install-btn{background:var(--gold);color:var(--ink);}
.install-banner .dismiss-btn{background:transparent;color:var(--text-dim);border:1px solid var(--line);}
@media (max-width:480px){.install-banner{flex-wrap:wrap;}.install-banner .txt{order:2;flex-basis:100%;}}
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <div>
      <h1>Ledger Duo</h1>
      <div class="sub">habits, head to head</div>
    </div>
    <div class="date">
      <div id="headerDate"></div>
      <div id="syncDot" style="font-size:11px;margin-top:2px;color:var(--text-dim);">🟢 Synced</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="calendar">Calendar</button>
    <button class="tab-btn" data-tab="goals">Goals</button>
  </div>

  <!-- TODAY -->
  <div class="view active" id="view-today">
    <div class="scoreboard" id="scoreboard"></div>
    <div class="columns" id="todayColumns"></div>
  </div>

  <!-- CALENDAR -->
  <div class="view" id="view-calendar">
    <div class="card">
      <div class="cal-nav">
        <button id="prevMonth" aria-label="Previous month">‹</button>
        <div class="month-label" id="monthLabel"></div>
        <button id="nextMonth" aria-label="Next month">›</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="weekday-row" id="weekdayRow"></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="day-panel" id="dayPanel" style="display:none;">
        <div class="day-panel-title" id="dayPanelTitle"></div>
        <div class="day-panel-cols" id="dayPanelCols"></div>
      </div>
    </div>
  </div>

  <!-- GOALS -->
  <div class="view" id="view-goals">
    <div class="columns" id="goalColumns"></div>
  </div>

  <div class="note">Synced live between both your phones. If a change didn't come through, check your connection and give it a second.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC5qGzZdieA9_w5Cr82aAgPPat6PUmXS4c",
  authDomain: "ledger-duo.firebaseapp.com",
  projectId: "ledger-duo",
  storageBucket: "ledger-duo.firebasestorage.app",
  messagingSenderId: "237316421798",
  appId: "1:237316421798:web:a98477c8365f7295989c67"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const stateRef = doc(db, "ledgerDuo", "sharedState");
let suppressNextRender = false; // avoid re-rendering off our own write echo mid-edit

let people = [
  {id:'p1', name:'You', color:'#C89B3C'},
  {id:'p2', name:'Partner', color:'#A8456B'}
];
let habits = [];   // {id, personId, name, createdAt}
let checks = {};   // key: habitId|YYYY-MM-DD -> true
let goals = [];    // {id, personId, name, target, current, unit, deadline}
let calCursor = new Date(); calCursor.setDate(1);

function pad(n){return n<10?'0'+n:''+n;}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return dstr(new Date());}
function uid(){return Math.random().toString(36).slice(2,10);}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

let saveTimer = null;

function currentState(){
  return { people, habits, checks, goals };
}

async function loadAll(){
  try{
    const snap = await getDoc(stateRef);
    if(snap.exists()){
      applyRemoteState(snap.data());
    } else {
      await setDoc(stateRef, { json: JSON.stringify(currentState()), updatedAt: Date.now() });
    }
  }catch(e){
    console.error('initial load failed', e);
    showStorageWarning('Could not connect to the shared board. Check your internet connection and reload.');
  }
  // Live updates from either device
  onSnapshot(stateRef, (snap)=>{
    if(!snap.exists()) return;
    applyRemoteState(snap.data());
    setSyncIndicator(true);
  }, (err)=>{
    console.error('live sync error', err);
    setSyncIndicator(false);
  });
}

function applyRemoteState(data){
  try{
    const parsed = JSON.parse(data.json);
    people = parsed.people || people;
    habits = parsed.habits || [];
    checks = parsed.checks || {};
    goals = parsed.goals || [];
    renderToday();
    renderGoals();
    if(document.getElementById('view-calendar').classList.contains('active')) renderCalendar();
  }catch(e){ console.error('bad remote state', e); }
}

function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 250); // small debounce so rapid taps batch into one write
}
async function doSave(){
  try{
    await setDoc(stateRef, { json: JSON.stringify(currentState()), updatedAt: Date.now() });
    setSyncIndicator(true);
  }catch(e){
    console.error('save failed', e);
    setSyncIndicator(false);
    showStorageWarning("Couldn't save your last change — check your connection. It'll retry on your next tap.");
  }
}
function savePeople(){ scheduleSave(); }
function saveHabits(){ scheduleSave(); }
function saveChecks(){ scheduleSave(); }
function saveGoals(){ scheduleSave(); }

function setSyncIndicator(ok){
  const el = document.getElementById('syncDot');
  if(!el) return;
  el.textContent = ok ? '🟢 Synced' : '⚠️ Offline';
}
function showStorageWarning(msg){
  let w = document.getElementById('storageWarning');
  if(!w){
    w = document.createElement('div');
    w.id = 'storageWarning';
    w.style.cssText = 'background:#A8456B;color:#F3EFE1;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center;';
    document.querySelector('.app').insertBefore(w, document.querySelector('.tabs'));
  }
  w.textContent = msg;
}
function savePeople(){ storeSet('people', people); }
function saveHabits(){ storeSet('habits', habits); }
function saveChecks(){ storeSet('checks', checks); }
function saveGoals(){ storeSet('goals', goals); }

function renderHeaderDate(){
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='calendar') renderCalendar();
    if(btn.dataset.tab==='goals') renderGoals();
  });
});

function computeStreak(habitId){
  let count=0, d=new Date();
  if(!checks[habitId+'|'+dstr(d)]) d.setDate(d.getDate()-1);
  while(checks[habitId+'|'+dstr(d)]){ count++; d.setDate(d.getDate()-1); }
  return count;
}

function weeklyPoints(personId){
  const habitIds = habits.filter(h=>h.personId===personId).map(h=>h.id);
  let pts=0;
  const d = new Date();
  for(let i=0;i<7;i++){
    const ds = dstr(d);
    habitIds.forEach(hid=>{ if(checks[hid+'|'+ds]) pts++; });
    d.setDate(d.getDate()-1);
  }
  return pts;
}

/* ---------- Scoreboard ---------- */
function renderScoreboard(){
  const sb = document.getElementById('scoreboard');
  const p1pts = weeklyPoints(people[0].id);
  const p2pts = weeklyPoints(people[1].id);
  let crown1='', crown2='';
  if(p1pts>p2pts) crown1='👑 '; else if(p2pts>p1pts) crown2='👑 ';
  sb.innerHTML = `
    <div class="score-side">
      <div class="score-name" style="color:${people[0].color}" data-p="0">${crown1}${escapeHtml(people[0].name)}</div>
      <div class="score-pts" style="color:${people[0].color}">${p1pts}</div>
      <div class="score-label">pts this week</div>
    </div>
    <div class="score-vs">vs</div>
    <div class="score-side">
      <div class="score-name" style="color:${people[1].color}" data-p="1">${crown2}${escapeHtml(people[1].name)}</div>
      <div class="score-pts" style="color:${people[1].color}">${p2pts}</div>
      <div class="score-label">pts this week</div>
    </div>
  `;
  sb.querySelectorAll('.score-name').forEach(el=>{
    el.addEventListener('click', ()=>renamePerson(parseInt(el.dataset.p)));
  });
}

function renamePerson(idx){
  const name = prompt('Name:', people[idx].name);
  if(name && name.trim()){
    people[idx].name = name.trim();
    savePeople();
    renderToday(); renderGoals(); if(document.getElementById('view-calendar').classList.contains('active')) renderCalendar();
  }
}

/* ---------- Today columns ---------- */
function renderToday(){
  renderScoreboard();
  const wrap = document.getElementById('todayColumns');
  wrap.innerHTML = '';
  const t = todayStr();
  people.forEach((person, idx)=>{
    const col = document.createElement('div');
    col.className = 'person-card';
    col.style.setProperty('--p-color', person.color);
    const personHabits = habits.filter(h=>h.personId===person.id);
    let done=0;
    let rowsHtml = '';
    personHabits.forEach(h=>{
      const key = h.id+'|'+t;
      const isDone = !!checks[key];
      if(isDone) done++;
    });
    const pct = personHabits.length ? Math.round(done/personHabits.length*100) : 0;

    col.innerHTML = `
      <div class="person-head">
        <div class="person-name" data-p="${idx}">${escapeHtml(person.name)}</div>
        <div class="person-pct">${done}/${personHabits.length}</div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="habit-list"></div>
      <div class="empty" style="${personHabits.length?'display:none;':''}">No habits yet.</div>
      <div class="add-form">
        <input type="text" placeholder="Add a habit" maxlength="50">
        <button class="btn">Add</button>
      </div>
    `;
    const listEl = col.querySelector('.habit-list');
    personHabits.forEach(h=>{
      const key = h.id+'|'+t;
      const isDone = !!checks[key];
      const streak = computeStreak(h.id);
      const row = document.createElement('div');
      row.className = 'habit-row';
      row.innerHTML = `
        <button class="check ${isDone?'checked':''}" aria-label="Toggle ${h.name}">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1B1E17" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>
        </button>
        <div class="habit-name ${isDone?'done':''}">${escapeHtml(h.name)}</div>
        <div class="streak">${streak>0?'🔥'+streak:''}</div>
        <button class="del-btn" aria-label="Delete ${h.name}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
        </button>
      `;
      row.querySelector('.check').addEventListener('click', ()=>{
        if(checks[key]) delete checks[key]; else checks[key] = true;
        saveChecks(); renderToday();
      });
      row.querySelector('.del-btn').addEventListener('click', ()=>{
        if(confirm('Delete "'+h.name+'"?')){
          habits = habits.filter(x=>x.id!==h.id);
          Object.keys(checks).forEach(k=>{ if(k.startsWith(h.id+'|')) delete checks[k]; });
          saveHabits(); saveChecks(); renderToday();
        }
      });
      listEl.appendChild(row);
    });

    col.querySelector('.person-name').addEventListener('click', ()=>renamePerson(idx));
    const input = col.querySelector('input');
    const addBtn = col.querySelector('.btn');
    function doAdd(){
      const name = input.value.trim();
      if(!name) return;
      habits.push({id:uid(), personId:person.id, name, createdAt: todayStr()});
      input.value='';
      saveHabits(); renderToday();
    }
    addBtn.addEventListener('click', doAdd);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') doAdd(); });

    wrap.appendChild(col);
  });
}

/* ---------- Calendar ---------- */
function renderCalendar(){
  document.getElementById('monthLabel').textContent = calCursor.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  const legend = document.getElementById('legend');
  legend.innerHTML = `<span><span class="dot" style="background:${people[0].color}"></span>${escapeHtml(people[0].name)}</span><span><span class="dot" style="background:${people[1].color}"></span>${escapeHtml(people[1].name)}</span>`;

  const wdRow = document.getElementById('weekdayRow');
  wdRow.innerHTML = '';
  ['S','M','T','W','T','F','S'].forEach(w=>{ const el=document.createElement('div'); el.textContent=w; wdRow.appendChild(el); });

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const year = calCursor.getFullYear(), month = calCursor.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayS = todayStr();

  for(let i=0;i<firstDay;i++){
    const cell = document.createElement('div'); cell.className='day-cell empty-cell'; grid.appendChild(cell);
  }
  for(let day=1; day<=daysInMonth; day++){
    const dateObj = new Date(year, month, day);
    const ds = dstr(dateObj);
    const isFuture = ds > todayS;
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (ds===todayS?' today':'') + (isFuture?' future':'');

    people.forEach(person=>{
      const personHabits = habits.filter(h=>h.personId===person.id);
      let done=0;
      personHabits.forEach(h=>{ if(checks[h.id+'|'+ds]) done++; });
      const pct = personHabits.length ? (done/personHabits.length*100) : 0;
      const half = document.createElement('div');
      half.className = 'half';
      const fill = document.createElement('div');
      fill.className = 'half-fill';
      fill.style.height = (isFuture?0:pct)+'%';
      fill.style.background = person.color;
      fill.style.opacity = '0.8';
      half.appendChild(fill);
      cell.appendChild(half);
    });
    const num = document.createElement('div');
    num.className='day-num'; num.textContent=day;
    cell.appendChild(num);
    if(!isFuture) cell.addEventListener('click', ()=>openDayPanel(ds, dateObj));
    grid.appendChild(cell);
  }
  document.getElementById('dayPanel').style.display='none';
}

function openDayPanel(ds, dateObj){
  const panel = document.getElementById('dayPanel');
  panel.style.display='block';
  document.getElementById('dayPanelTitle').textContent = dateObj.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
  const cols = document.getElementById('dayPanelCols');
  cols.innerHTML = '';
  people.forEach(person=>{
    const col = document.createElement('div');
    const personHabits = habits.filter(h=>h.personId===person.id);
    col.innerHTML = `<div class="day-panel-name" style="color:${person.color}">${escapeHtml(person.name)}</div>`;
    if(!personHabits.length){
      col.innerHTML += '<div class="empty">No habits yet.</div>';
    }
    personHabits.forEach(h=>{
      const key = h.id+'|'+ds;
      const isDone = !!checks[key];
      const row = document.createElement('div');
      row.className = 'habit-row';
      row.innerHTML = `
        <button class="check ${isDone?'checked':''}" style="--p-color:${person.color}" aria-label="Toggle ${h.name}">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1B1E17" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>
        </button>
        <div class="habit-name ${isDone?'done':''}">${escapeHtml(h.name)}</div>
      `;
      row.querySelector('.check').addEventListener('click', ()=>{
        if(checks[key]) delete checks[key]; else checks[key] = true;
        saveChecks(); renderCalendar(); openDayPanel(ds, dateObj);
      });
      col.appendChild(row);
    });
    cols.appendChild(col);
  });
}

document.getElementById('prevMonth').addEventListener('click', ()=>{ calCursor.setMonth(calCursor.getMonth()-1); renderCalendar(); });
document.getElementById('nextMonth').addEventListener('click', ()=>{ calCursor.setMonth(calCursor.getMonth()+1); renderCalendar(); });

/* ---------- Goals ---------- */
function renderGoals(){
  const wrap = document.getElementById('goalColumns');
  wrap.innerHTML = '';
  people.forEach((person, idx)=>{
    const col = document.createElement('div');
    col.className = 'person-card';
    col.style.setProperty('--p-color', person.color);
    const personGoals = goals.filter(g=>g.personId===person.id);
    col.innerHTML = `
      <div class="person-head">
        <div class="person-name" data-p="${idx}">${escapeHtml(person.name)}'s monthly goals</div>
      </div>
      <div class="goal-list"></div>
      <div class="empty" style="${personGoals.length?'display:none;':''}">No goals yet.</div>
      <div class="add-form">
        <input type="text" placeholder="Add a goal" maxlength="50">
        <button class="btn">Add</button>
      </div>
      <button class="toggle-more">+ set a target</button>
      <div class="extra-fields">
        <input type="number" placeholder="Target" min="1">
        <input type="text" placeholder="Unit (km, books..)">
      </div>
    `;
    const listEl = col.querySelector('.goal-list');
    personGoals.forEach(g=>{
      const pct = g.target ? Math.min(100, Math.round((g.current/g.target)*100)) : (g.current>0?100:0);
      const gc = document.createElement('div');
      gc.className = 'goal-card';
      gc.innerHTML = `
        <div class="goal-top">
          <div class="goal-name">${escapeHtml(g.name)}</div>
          <button class="del-btn" aria-label="Delete goal">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
          </button>
        </div>
        <div class="goal-row">
          <div class="goal-track"><div class="goal-fill" style="width:${pct}%"></div></div>
          <div class="goal-nums">${g.current}${g.target?('/'+g.target):''} ${escapeHtml(g.unit||'')}</div>
        </div>
        <div class="goal-controls">
          <button class="minus">−</button>
          <button class="plus">+</button>
        </div>
      `;
      gc.querySelector('.plus').addEventListener('click', ()=>{ g.current=(g.current||0)+1; saveGoals(); renderGoals(); });
      gc.querySelector('.minus').addEventListener('click', ()=>{ g.current=Math.max(0,(g.current||0)-1); saveGoals(); renderGoals(); });
      gc.querySelector('.del-btn').addEventListener('click', ()=>{
        if(confirm('Delete goal "'+g.name+'"?')){ goals = goals.filter(x=>x.id!==g.id); saveGoals(); renderGoals(); }
      });
      listEl.appendChild(gc);
    });

    col.querySelector('.person-name').addEventListener('click', ()=>renamePerson(idx));
    const toggleBtn = col.querySelector('.toggle-more');
    const extra = col.querySelector('.extra-fields');
    toggleBtn.addEventListener('click', ()=> extra.classList.toggle('show'));
    const input = col.querySelector('.add-form input');
    const addBtn = col.querySelector('.add-form .btn');
    function doAdd(){
      const name = input.value.trim();
      if(!name) return;
      const target = parseFloat(extra.querySelector('input[type=number]').value) || 0;
      const unit = extra.querySelector('input[type=text]').value.trim();
      goals.push({id:uid(), personId:person.id, name, target, unit, current:0, createdAt: todayStr()});
      input.value=''; extra.querySelector('input[type=number]').value=''; extra.querySelector('input[type=text]').value='';
      saveGoals(); renderGoals();
    }
    addBtn.addEventListener('click', doAdd);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') doAdd(); });

    wrap.appendChild(col);
  });
}

/* ---------- PWA setup ---------- */
function buildIcon(){
  const c = document.createElement('canvas');
  c.width = 192; c.height = 192;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1B1E17';
  roundRect(ctx,0,0,192,192,34); ctx.fill();
  ctx.beginPath(); ctx.arc(78,96,46,0,Math.PI*2); ctx.fillStyle='#C89B3C'; ctx.globalAlpha=0.92; ctx.fill();
  ctx.beginPath(); ctx.arc(122,96,46,0,Math.PI*2); ctx.fillStyle='#A8456B'; ctx.globalAlpha=0.92; ctx.fill();
  ctx.globalAlpha=1;
  return c.toDataURL('image/png');
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function setupPWA(){
  const iconData = buildIcon();
  document.getElementById('faviconLink').href = iconData;
  document.getElementById('appleIconLink').href = iconData;

  const manifest = {
    name: 'Ledger Duo — Habit Tracker',
    short_name: 'Ledger Duo',
    start_url: '.',
    display: 'standalone',
    background_color: '#1B1E17',
    theme_color: '#1B1E17',
    icons: [
      { src: iconData, sizes: '192x192', type: 'image/png' },
      { src: iconData, sizes: '512x512', type: 'image/png' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  document.getElementById('manifestLink').href = URL.createObjectURL(blob);

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isStandalone) return;

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    showBanner(true);
  });

  function showBanner(canPromptInstall){
    if(document.getElementById('installBanner')) return;
    const banner = document.createElement('div');
    banner.id = 'installBanner';
    banner.className = 'install-banner';
    const msg = canPromptInstall
      ? 'Install Ledger Duo as an app on this device for quick, full-screen access.'
      : isIOS
        ? 'Add Ledger Duo to your Home Screen: tap the <b>Share</b> icon, then <b>Add to Home Screen</b>.'
        : 'Add Ledger Duo to your Home Screen from your browser menu for a full-screen app-like experience.';
    banner.innerHTML = `
      <img class="icn" src="${iconData}" alt="">
      <div class="txt">${msg}</div>
      <div class="actions">
        ${canPromptInstall ? '<button class="install-btn">Install</button>' : ''}
        <button class="dismiss-btn">Not now</button>
      </div>
    `;
    document.body.appendChild(banner);
    if(canPromptInstall){
      banner.querySelector('.install-btn').addEventListener('click', async ()=>{
        banner.remove();
        if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
      });
    }
    banner.querySelector('.dismiss-btn').addEventListener('click', ()=> banner.remove());
  }

  // Fallback: if no install prompt fires (iOS, or criteria unmet), still show manual instructions after a short delay.
  setTimeout(()=>{ if(!document.getElementById('installBanner')) showBanner(false); }, 1500);
}

/* ---------- Init ---------- */
(async function init(){
  renderHeaderDate();
  await loadAll();
  renderToday();
  renderGoals();
  setupPWA();
})();
</script>
